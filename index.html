<!DOCTYPE html>

<html>
<head>

    <!-- Title -->

    <title>
        TigaSama - Website
    </title>

    <!-- Meta -->

    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />

    <!------- CSS ------->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/6.11.1/css/flag-icons.min.css" />
    <link rel="stylesheet" href="assets/css/css-master.min.css">
</head>

<!-- Desktop -->

<body>

    <div class="content page-load">

        <!--Page-->

        <div class="loader">
            <div class="loader-logo">
                <span class="text split-char">
                    <span>
                        TigaSama
                    </span>
                </span>
                <span class="caption split-char">
                    <span>
                        News - Sport
                    </span>
                </span>
            </div>
        </div>

        <div id="smooth-wrapper">
            <div id="smooth-content">
                <div class="page">
                    <div class="page-wrapper primary">

                        <!--Navbar - Primary-->

                        <nav class="navbar primary navbar-expand-lg">

                        </nav>

                        <div class="menu-overlay"></div>

                        <!--Index-->

                        <div class="page-content page-index">

                            <!--Wizard-->

                            <div class="wizard">

                                <!-- Hero - Primary -->

                                <section class="section theme hero primary">

                                </section>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!------- Script ------->

    <script src="assets/javascript/vendor-javascript.js"></script>
    <script src="assets/javascript/gsap.js"></script>

    <script src="assets/javascript/custom-select2.js"></script>
    <script src="assets/javascript/custom-javascript.js"></script>

    <script>

        // Button Magentic

        var magnets = document.querySelectorAll('.btn-magnetic')
        var strength = 20

        magnets.forEach((magnet) => {
            magnet.addEventListener('mousemove', moveMagnet);
            magnet.addEventListener('mouseout', function (event) {
                TweenMax.to(event.currentTarget, 1, { x: 0, y: 0, ease: Power4.easeOut })
            });
        });

        function moveMagnet(event) {
            var magnetButton = event.currentTarget
            var bounding = magnetButton.getBoundingClientRect()

            TweenMax.to(magnetButton, 1, {
                x: (((event.clientX - bounding.left) / magnetButton.offsetWidth) - 0.5) * strength,
                y: (((event.clientY - bounding.top) / magnetButton.offsetHeight) - 0.5) * strength,
                ease: Power4.easeOut
            })
        }
    </script>

    <script>
        function disableWheelScroll() {
            window.addEventListener('wheel', preventWheel, { passive: false });
        }

        function enableWheelScroll() {
            window.removeEventListener('wheel', preventWheel);
        }

        function preventWheel(e) {
            e.preventDefault();
        }

        // Page Transition

        $(document).ready(function () {
            gsap.fromTo("body",
                { opacity: 0 },
                { opacity: 1, duration: 0.75, ease: "cubic-bezier(0.625, 0.05, 0, 1)" }
            );

            $("a[href]").on("click", function (e) {
                const href = $(this).attr("href");

                if (!href || href === "#" || href.startsWith("javascript:void")) return;

                e.preventDefault();
                gsap.to("body", {
                    opacity: 0,
                    duration: 0.75,
                    ease: "cubic-bezier(0.625, 0.05, 0, 1)",
                    onComplete: () => window.location.href = href
                });
            });
        });

        // Page Loader

        $(document).ready(function () {
            setTimeout(function () {
                $('body .content').addClass('page-load-start');
                disableWheelScroll();
            }, 0);
            setTimeout(function () {
                $('body .content').addClass('page-load-progress');
            }, 500);
            setTimeout(function () {

            }, 500);
            setTimeout(function () {
                $('body .content').addClass('page-load-complete');
 
            }, 1750);
            setTimeout(function () {
                enableWheelScroll();
            }, 3000);
        });
    </script>
</body>
</html>
